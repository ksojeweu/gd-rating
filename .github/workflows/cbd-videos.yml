name: cbd-videos

# Ссылки на видео для всех рекордов CoreBoard -> cbd/cbd_videos.json
#   {"users": {"<ID CoreBoard>": [["Название уровня", процент, "ссылка"], ...]}}
# Ссылки можно вписывать вручную прямо в cbd/cbd_videos.json: пока процент рекорда тот же, они не трогаются.
# Если процент изменился, старая ссылка убирается и ищется новая.

on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Сколько минут максимум искать видео (остальное дойдёт в следующем запуске)"
        required: false
        default: "40"
  # После auto-update (он уже обновил CoreBoard-данные). Файл workflow должен лежать в основной ветке.
  workflow_run:
    workflows: ["auto-update"]   # должно совпадать с name: в auto-update.yml
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cbd-videos
  cancel-in-progress: false

jobs:
  videos:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests

      # Кеш "видео не нашлось" (чтобы не искать одно и то же каждый запуск)
      - name: Restore video cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/videocache.json
          key: videocache-${{ github.run_id }}
          restore-keys: videocache-

      - name: Run cbd-videos.py
        run: python scripts/cbd-videos.py --commit --budget-min ${{ github.event.inputs.budget_min || '40' }}

      - name: Save video cache
        if: ${{ always() && hashFiles('scripts/videocache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: scripts/videocache.json
          key: videocache-${{ github.run_id }}
