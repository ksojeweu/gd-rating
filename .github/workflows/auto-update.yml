name: auto-update

# Один workflow на оба обновления:
#   1. sync-extras.py: что есть в CoreBoard, а у нас нет  -> my_extras.json, levels_tp.json
#   2. cbd-update.py:  что есть у нас, а в CoreBoard нет  -> cbd/ (missing_achievements, with_nicks, commands)
#   3. cbd-stale.py:   непринятые рекорды CoreBoard (старше месяца / моложе / без даты) -> cbd/unaccepted_records.json
# Старый sync-extras.yml нужно удалить, иначе sync-extras будет запускаться дважды.

on:
  workflow_dispatch:
    inputs:
      extras_args:
        description: "Аргументы для sync-extras.py (например --dry-run или --force)"
        required: false
        default: ""
  # Запускается только после того, как закончился make-links.
  # Файл workflow должен лежать в основной ветке, иначе workflow_run не сработает.
  workflow_run:
    workflows: ["make-links"]   # должно совпадать с name: в make-links.yml
    types: [completed]

# Листы (WML и любые будущие), которые автообновление НЕ трогает (через запятую, пусто = все включены).
env:
  GL_LISTS_OFF: ""

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  build:
    # После make-links идём только если он закончился успешно; ручной запуск работает как раньше
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests

      # Кеш gd-rating (профили игроков, страны, записи уровней)
      - name: Restore gd-rating cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/levelcache.json
          key: levelcache-${{ github.run_id }}
          restore-keys: levelcache-

      - name: Run sync-extras.py
        run: python scripts/sync-extras.py --commit ${{ github.event.inputs.extras_args }}

      # Выполняется и после сбоя первого шага, чтобы одно обновление не блокировало другое.
      # Страницы CoreBoard, скачанные первым шагом, берутся из кеша (час), второй раз не качаются.
      - name: Run cbd-update.py
        if: ${{ !cancelled() }}
        run: python scripts/cbd-update.py --commit

      # Все непринятые рекорды CoreBoard (старше месяца, моложе, без даты) -> cbd/unaccepted_records.json.
      # Нужны root/missing_achievements.json (его пишет sync-extras) и scripts/cbd.json (coreboard-parse).
      # YOUTUBE_API_KEY необязателен: без него даты видео берутся со страниц YouTube (иногда режутся).
      - name: Run cbd-stale.py
        if: ${{ !cancelled() }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/cbd-stale.py --commit

      # Промежуточные файлы запуска в репозиторий не коммитятся. Чтобы их посмотреть, скачай артефакт "debug-files":
      # Actions -> нужный запуск -> внизу раздел Artifacts.
      - name: Upload debug files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            scripts/gdr.txt
            scripts/cbd.txt
            scripts/cbd.json
            scripts/cbd_ids.json
            scripts/cbd-update/
            scripts/cbd-stale/
          if-no-files-found: ignore
          retention-days: 3

      # Сохраняем и после сбоя, и если запуск не уложился в timeout-minutes
      - name: Save gd-rating cache
        if: ${{ always() && hashFiles('scripts/levelcache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: scripts/levelcache.json
          key: levelcache-${{ github.run_id }}
